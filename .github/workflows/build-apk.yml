# Builds an installable debug APK from a branch, on demand.
# Actions tab → "Build APK" → Run workflow → pick the branch in "Use workflow from".
# The APK is attached to a pre-release named after the branch (tag apk-<branch>), replacing
# that branch's previous build, so each branch has one stable download link.
name: Build APK

on:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # to publish the release
    steps:
      - uses: actions/checkout@v4

      # The Gradle daemon is pinned to JDK 25 (gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags can't contain "/", so claude/foo becomes apk-claude-foo.
          slug=$(echo "$GITHUB_REF_NAME" | tr '/' '-' | tr -cd 'A-Za-z0-9._-')
          tag="apk-$slug"
          apk="metro-tracker-$slug-$GITHUB_RUN_NUMBER.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" "$apk" --prerelease --target "$GITHUB_SHA" \
            --title "APK: $GITHUB_REF_NAME (build $GITHUB_RUN_NUMBER)" \
            --notes "Branch \`$GITHUB_REF_NAME\`, commit ${GITHUB_SHA::7}. Download the APK on your phone and install it."
          echo "### APK ready: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
