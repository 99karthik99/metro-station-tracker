# Runs the unit tests and builds the debug app on every pull request and on pushes to main
# and claude/** branches. Pushes also publish the APK to the "dev" GitHub release, so the
# latest build can be installed on a phone without Android Studio.
name: CI

on:
  pull_request:
  push:
    branches: [main, "claude/**"]

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write # to publish the dev release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The Gradle daemon is pinned to JDK 25 (gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle downloads between runs.
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/

      # The release always holds the latest pushed build, whichever branch it came from.
      - name: Publish APK to the dev release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="metro-tracker-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev "$apk" --prerelease --target "$GITHUB_SHA" \
            --title "Dev build ${GITHUB_RUN_NUMBER}" \
            --notes "Branch \`${GITHUB_REF_NAME}\`, commit ${GITHUB_SHA::7}. Download the APK on your phone and install it."
